name: Build & Deploy Resume

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The committed lockfile was generated on Windows and bakes in that
        # platform's optional-dependency resolution, so neither `npm ci` nor
        # `npm install` will install rollup's Linux binary on the runner
        # (npm/cli#4828). Removing the lockfile forces a clean per-platform
        # resolve — exactly what the rollup error message instructs.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Validate resume.json against JSON Resume schema
        run: npm run validate

      - name: Build Astro site
        run: npm run build

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Compile PDF
        run: npm run build:pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
